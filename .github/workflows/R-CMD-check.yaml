## Thin caller -- the matrix, system dependencies, caching and the check
## itself all live in PredictiveEcology/actions. This file only says which
## package to check and what it needs on top of the org defaults.
##
## No concurrency block here: the reusable workflow has one, and its
## cancel-in-progress is scoped to pull requests so a push to a default
## branch still runs to completion.

name: R-CMD-check

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

jobs:
  R-CMD-check:
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
